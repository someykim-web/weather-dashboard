<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weather Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container app py-4 py-md-5">
    <!-- Header + Dark mode toggle (Soal 4) -->
    <header class="d-flex justify-content-between align-items-center gap-3 mb-4">
      <div>
        <h1 class="app-title m-0">Weather Dashboard</h1>
        <p class="app-sub m-0">Cek cuaca & prakiraan 5 hari di kota mana saja</p>
      </div>
      <button id="darkModeToggle" type="button" class="btn btn-theme">
        🌙 Dark Mode
      </button>
    </header>

    <!-- Search Form -->
    <!-- atribut "required" dihapus agar validasi kota kosong ditangani oleh modal (Soal 1a) -->
    <section class="panel mb-4">
      <form id="searchForm" class="row g-2 align-items-center">
        <div class="col-md-8">
          <input type="text" id="cityInput" class="form-control form-control-lg" placeholder="Masukkan nama kota, mis. Bandung">
        </div>
        <div class="col-md-4 d-grid">
          <button type="submit" class="btn btn-search btn-lg">Search</button>
        </div>
      </form>

      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mt-3">
        <!-- Favorites -->
        <div class="flex-grow-1">
          <span class="section-label">Favorites</span>
          <ul id="favorites" class="fav-list list-unstyled m-0 mt-2"></ul>
        </div>

        <!-- Celsius / Fahrenheit switch (Soal 3) -->
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" role="switch" id="unitToggle">
          <label class="form-check-label" for="unitToggle" id="unitLabel">Celsius (°C)</label>
        </div>
      </div>
    </section>

    <!-- Current Weather -->
    <div id="currentWeather" class="mb-4">
      <div class="empty-state">Cari nama kota untuk melihat cuacanya.</div>
    </div>

    <!-- Forecast -->
    <div id="forecast" class="row g-3"></div>
  </div>

  <!-- Error Modal (Soal 1) -->
  <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="errorModalTitle">Error</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="errorModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap JS bundle diperlukan agar modal bisa berjalan -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
