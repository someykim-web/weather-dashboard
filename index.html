<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weather Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

  <div class="container py-4">
    <!-- Header + Dark mode toggle (Soal 4) -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="m-0">Weather Dashboard</h1>
      <button id="darkModeToggle" type="button" class="btn btn-outline-secondary">
        🌙 Dark Mode
      </button>
    </div>

    <!-- Search Form -->
    <!-- atribut "required" dihapus agar validasi kota kosong ditangani oleh modal (Soal 1a) -->
    <form id="searchForm" class="row g-2 mb-3">
      <div class="col-md-8">
        <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
      </div>
      <div class="col-md-4 d-grid">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <!-- Celsius / Fahrenheit switch (Soal 3) -->
    <div class="form-check form-switch mb-4">
      <input class="form-check-input" type="checkbox" role="switch" id="unitToggle">
      <label class="form-check-label" for="unitToggle" id="unitLabel">Celsius (°C)</label>
    </div>

    <!-- Favorites -->
    <h5>Favorites</h5>
    <ul id="favorites" class="list-group mb-4"></ul>

    <!-- Current Weather -->
    <div id="currentWeather" class="mb-4"></div>

    <!-- Forecast -->
    <div id="forecast" class="row g-3"></div>
  </div>

  <!-- Error Modal (Soal 1) -->
  <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="errorModalTitle">Error</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="errorModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap JS bundle diperlukan agar modal bisa berjalan -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
